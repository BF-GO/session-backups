name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Generate coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Build production extension
        run: npm run build

      - name: Create installable archive
        run: npm run zip

      - name: Verify package and manifest versions
        id: version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./.output/chrome-mv3/manifest.json').version")"
          if [[ "$package_version" != "$manifest_version" ]]; then
            echo "Version mismatch: package=$package_version manifest=$manifest_version" >&2
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Upload extension archive
        uses: actions/upload-artifact@v7
        with:
          name: session-saver-${{ steps.version.outputs.package_version }}-chrome
          path: .output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
